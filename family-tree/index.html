<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suhas Family Tree</title>
<style>
:root{
  color-scheme: light;
  --surface-0:#ffffff; --surface-1:#fbfbf9; --surface-2:#f4f4f1; --surface-3:#ecebe7;
  --border:#e2e1db; --border-strong:#cfcec7;
  --text-primary:#14140f; --text-secondary:#56554e; --text-muted:#8d8c83;
  --male:#2a78d6; --female:#e87ba4; --unknown:#8d8c83;
  --male-fill:#dee9f8; --female-fill:#fbebf1; --unknown-fill:#ececeb;
  --accent:#14140f;
  --shadow:0 1px 2px rgba(20,20,15,.06), 0 8px 24px rgba(20,20,15,.07);
}
@supports (color: color-mix(in oklab, red, blue)){
  :root{
    --male-fill:color-mix(in oklab, var(--male) 15%, var(--surface-0));
    --female-fill:color-mix(in oklab, var(--female) 17%, var(--surface-0));
    --unknown-fill:color-mix(in oklab, var(--unknown) 13%, var(--surface-0));
  }
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface-0:#141413; --surface-1:#1a1a19; --surface-2:#232321; --surface-3:#2c2c29;
    --border:#33332f; --border-strong:#46453f;
    --text-primary:#f7f7f4; --text-secondary:#b4b3a9; --text-muted:#7c7b73;
    --male:#3987e5; --female:#d55181; --unknown:#7c7b73;
    --male-fill:#1d2c3e; --female-fill:#3a2029; --unknown-fill:#26262a;
    --accent:#f7f7f4;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.34);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-0:#141413; --surface-1:#1a1a19; --surface-2:#232321; --surface-3:#2c2c29;
  --border:#33332f; --border-strong:#46453f;
  --text-primary:#f7f7f4; --text-secondary:#b4b3a9; --text-muted:#7c7b73;
  --male:#3987e5; --female:#d55181; --unknown:#7c7b73;
  --male-fill:#1d2c3e; --female-fill:#3a2029; --unknown-fill:#26262a;
  --accent:#f7f7f4;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.34);
}
@supports (color: color-mix(in oklab, red, blue)){
  :root[data-theme="dark"], :root:where(:not([data-theme="light"])){
    --male-fill:color-mix(in oklab, var(--male) 26%, var(--surface-1));
    --female-fill:color-mix(in oklab, var(--female) 26%, var(--surface-1));
    --unknown-fill:color-mix(in oklab, var(--unknown) 22%, var(--surface-1));
  }
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--surface-1); color:var(--text-primary);
  font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; overflow:hidden;
}

/* ---------- chrome ---------- */
header{
  padding:11px 18px; border-bottom:1px solid var(--border); background:var(--surface-1);
  display:flex; gap:14px; align-items:center; flex-wrap:wrap; flex:none; z-index:3;
}
h1{font-size:14.5px; font-weight:640; margin:0; letter-spacing:-.015em; white-space:nowrap}
.stats{color:var(--text-muted); font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap}
.controls{display:flex; gap:7px; align-items:center; margin-left:auto; flex-wrap:wrap}
.field{position:relative; display:flex; align-items:center}
.field svg{position:absolute; left:9px; width:13px; height:13px; color:var(--text-muted); pointer-events:none}
input[type=search]{
  font:inherit; font-size:13px; padding:6px 10px 6px 27px; border-radius:8px; width:194px;
  border:1px solid var(--border); background:var(--surface-2); color:var(--text-primary);
  transition:border-color .12s, background .12s;
}
input[type=search]:focus{outline:none; border-color:var(--border-strong); background:var(--surface-0)}
select,button{
  font:inherit; font-size:13px; padding:6px 11px; border-radius:8px; cursor:pointer;
  border:1px solid var(--border); background:var(--surface-2); color:var(--text-primary);
  transition:background .12s, border-color .12s, color .12s;
}
select:hover,button:hover{background:var(--surface-3); border-color:var(--border-strong)}
button[aria-pressed=true]{background:var(--text-primary); color:var(--surface-1); border-color:var(--text-primary)}

main{flex:1; display:flex; min-height:0; position:relative}
#graph{flex:1; min-width:0; position:relative}
svg{display:block; width:100%; height:100%; cursor:grab; touch-action:none}
svg.dragging{cursor:grabbing}

/* ---------- graph marks ---------- */
.genline{stroke:var(--border); stroke-width:1; stroke-dasharray:1 7; opacity:.85}
.genlabel{
  font-size:10px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  fill:var(--text-muted); opacity:.75;
}
.link{fill:none; stroke:var(--border-strong); stroke-opacity:.62; transition:stroke-opacity .25s}
.link.spouse{stroke-dasharray:2.5 3.5; stroke-opacity:.5}
.node{cursor:pointer}
/* Colour lives in CSS. getComputedStyle on a custom property returns an
   unresolved token stream (var() inside color-mix), which is invalid as an SVG
   fill attribute — so classes, not attribute writes. Theme switching is free. */
.by-sex .node.s-m circle{fill:var(--male-fill);   stroke:var(--male)}
.by-sex .node.s-f circle{fill:var(--female-fill); stroke:var(--female)}
.by-sex .node.s-u circle{fill:var(--unknown-fill);stroke:var(--unknown)}
.by-lineage .node.l-0 circle{fill:var(--male-fill);   stroke:var(--male)}
.by-lineage .node.l-1 circle{fill:var(--female-fill); stroke:var(--female)}
.by-lineage .node.l-2 circle{fill:var(--unknown-fill);stroke:var(--unknown)}
.chip i.s-m{background:var(--male-fill);   border:1.4px solid var(--male)}
.chip i.s-f{background:var(--female-fill); border:1.4px solid var(--female)}
.chip i.s-u{background:var(--unknown-fill);border:1.4px solid var(--unknown)}
.legend i.l-0{background:var(--male-fill);   border-color:var(--male)}
.legend i.l-1{background:var(--female-fill); border-color:var(--female)}
.legend i.l-2{background:var(--unknown-fill);border-color:var(--unknown)}
.node circle{
  stroke-width:1.75;
  transition:r .18s cubic-bezier(.34,1.3,.64,1), stroke-width .18s, opacity .25s, filter .18s;
}
.node text{
  font-size:11px; font-weight:480; letter-spacing:-.005em; pointer-events:none;
  paint-order:stroke; stroke:var(--surface-1); stroke-width:3.5px; stroke-linejoin:round;
  transition:fill .25s, opacity .25s;
}
.node.living  text{fill:var(--text-primary)}
.node.deceased text{fill:var(--text-muted); font-weight:440}
.node.deceased circle{opacity:.82}
.node:hover circle{filter:drop-shadow(0 0 7px rgba(0,0,0,.2))}
.node.sel circle{stroke:var(--accent); stroke-width:2.75}
.node.sel text{fill:var(--text-primary); font-weight:660}
.node.hl circle{stroke-width:2.4}
.dim{opacity:.1}
.dim text{opacity:.45}

/* ---------- panel ---------- */
aside{
  width:326px; flex:none; border-left:1px solid var(--border); background:var(--surface-2);
  overflow-y:auto; padding:18px; scrollbar-width:thin;
}
aside h2{font-size:17px; margin:0 0 1px; letter-spacing:-.02em; line-height:1.25}
.telugu{font-size:16px; color:var(--text-secondary); margin:2px 0 11px}
.badges{margin-bottom:10px; display:flex; gap:5px; flex-wrap:wrap}
.badge{
  font-size:10.5px; padding:2.5px 8px; border-radius:20px; font-weight:520;
  border:1px solid var(--border-strong); color:var(--text-secondary); background:var(--surface-1);
}
.badge.warn{border-color:var(--female); color:var(--female)}
.badge.sex{border:none; padding:3px 9px}
.badge.male{background:var(--male-fill); color:var(--male)}
.badge.female{background:var(--female-fill); color:var(--female)}
dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:5px 14px; font-size:13px}
dt{color:var(--text-muted)}
dd{margin:0}
.sect{margin-top:14px; padding-top:12px; border-top:1px solid var(--border)}
.sect h3{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted);
  margin:0 0 5px; font-weight:640;
}
.sect + .sect{margin-top:12px}
.people-list{display:flex; flex-wrap:wrap; gap:4px}
.chip{
  font-size:12.5px; padding:3px 9px; border-radius:7px; cursor:pointer; background:var(--surface-1);
  border:1px solid var(--border); color:var(--text-primary); transition:border-color .12s, background .12s;
  display:inline-flex; align-items:center; gap:5px;
}
.chip:hover{border-color:var(--border-strong); background:var(--surface-3)}
.chip i{width:7px; height:7px; border-radius:50%; flex:none}
.chip.gone{color:var(--text-muted)}
.bio{font-size:13.5px; line-height:1.6; color:var(--text-secondary)}
.bio h3,.bio h4{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted);
  margin:13px 0 5px; font-weight:640;
}
.bio h3:first-child{margin-top:0}
.bio p{margin:0 0 9px}
.bio blockquote{
  margin:10px 0; padding:2px 0 2px 12px; border-left:2px solid var(--border-strong); font-style:italic;
}
.empty{color:var(--text-muted); font-size:12.5px; font-style:italic}
.hint{color:var(--text-muted); font-size:12.5px; line-height:1.6}
kbd{
  font:inherit; font-size:11px; padding:1px 5px; border-radius:4px;
  border:1px solid var(--border-strong); background:var(--surface-1); color:var(--text-secondary);
}

footer{
  padding:9px 18px; border-top:1px solid var(--border); background:var(--surface-1);
  display:flex; gap:16px; align-items:center; flex-wrap:wrap; flex:none; z-index:3;
}
.legend{display:flex; gap:13px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--text-secondary)}
.legend i{
  display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px;
  vertical-align:-1px; border:1.6px solid;
}
.legend .m{background:var(--male-fill); border-color:var(--male)}
.legend .f{background:var(--female-fill); border-color:var(--female)}
.legend .d{background:var(--unknown-fill); border-color:var(--unknown); opacity:.8}

#tableView{display:none; flex:1; overflow:auto; padding:18px}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{text-align:left; padding:7px 11px; border-bottom:1px solid var(--border); vertical-align:top}
th{position:sticky; top:0; background:var(--surface-1); font-weight:620; color:var(--text-secondary)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td.gone{color:var(--text-muted)}

.tooltip{
  position:fixed; pointer-events:none; z-index:10; background:var(--surface-0);
  border:1px solid var(--border); border-radius:9px; padding:8px 11px; font-size:12.5px;
  box-shadow:var(--shadow); max-width:250px; opacity:0; transition:opacity .12s;
}
.tooltip b{font-weight:620}
.tooltip .sub{color:var(--text-muted); font-size:11.5px}

@media (max-width:860px){ aside{display:none} input[type=search]{width:128px} }
</style>
</head>

</footer>

  tip.style.left = Math.min(e.clientX + 15, innerWidth - 262) + "px";
  tip.style.top = (e.clientY + 15) + "px";
  const l2 = [d.birth && "b. " + d.birth, d.deceased ? (d.death ? "d. " + d.death : "deceased") : "living"]
    .filter(Boolean).join(" · ");
  tip.innerHTML = `<b>${esc(d.name)}</b>${d.telugu ? "<br>" + esc(d.telugu) : ""}`
    + `<br><span class="sub">${esc(l2)}</span>`;
}
function hideTip() { tip.style.opacity = 0; }

/* ---------- panel ---------- */
const panel = document.getElementById("panel");
const HINT = `<p class="hint">Click a person to see their life, their relatives and where
  they sit in the tree. Their ancestors and descendants stay lit; everyone else dims.<br><br>
  Vertical position is generation. Colour is <b>male</b> / <b>female</b>.
  Deceased names are greyed.</p>`;

function chip(pid) {
  const p = byId.get(pid);
  if (!p) return esc(pid);
  const sc = p.sex === "M" ? "s-m" : p.sex === "F" ? "s-f" : "s-u";
  return `<span class="chip${p.deceased ? " gone" : ""}" data-goto="${pid}">`
       + `<i class="${sc}"></i>${esc(p.name)}</span>`;
}
const chips = ids => ids && ids.length
  ? `<div class="people-list">${ids.map(chip).join("")}</div>`
  : `<span class="empty">none recorded</span>`;

function select(id, push = true) {
  selected = id;
  if (!id) {
    nodeEls.forEach(({ g }) => g.classList.remove("dim", "sel", "hl"));
    linkEls.forEach(e => e.classList.remove("dim"));
    panel.innerHTML = HINT;
    if (push && location.hash) history.replaceState(null, "", location.pathname);
    return;
  }
  const d = byId.get(id);
  if (!d) return;
  if (push) history.replaceState(null, "", "#/person/" + id);

  const lit = new Set([id, ...reach(id, parents), ...reach(id, children), ...(d.partners || [])]);
  nodeEls.forEach(({ g, n }) => {
    g.classList.toggle("dim", !lit.has(n.id));
    g.classList.toggle("sel", n.id === id);
    g.classList.remove("hl");
  });
  linkEls.forEach((e, i) => e.classList.toggle("dim",
    !(lit.has(links[i].source.id) && lit.has(links[i].target.id))));

  const rows = [];
  const add = (k, v) => { if (v) rows.push(`<dt>${k}</dt><dd>${esc(v)}</dd>`); };
  add("Born", [d.birth, d.birthPlace].filter(Boolean).join(", "));
  add(d.deceased ? "Died" : "Status",
      d.deceased ? ([d.death, d.deathPlace].filter(Boolean).join(", ") || "yes, date unknown") : "living");
  add("Married name", d.marriedName);
  add("Occupation", d.occupation);
  add("Native place", d.nativePlace);
  add("Gotra", d.gotra);
  add("Generation", d.gen + 1);

  const sexBadge = d.sex === "M" ? `<span class="badge sex male">male</span>`
                 : d.sex === "F" ? `<span class="badge sex female">female</span>` : "";

  panel.innerHTML =
      `<h2>${esc(d.name)}</h2>`
    + (d.telugu ? `<div class="telugu">${esc(d.telugu)}</div>` : "")
    + `<div class="badges">${sexBadge}`
    +   (d.deceased ? `<span class="badge">deceased</span>` : "")
    +   (d.confidence !== "high" ? `<span class="badge warn">unverified reading</span>` : "")
    +   (d.redacted ? `<span class="badge">details withheld — living</span>` : "")
    + `</div>`
    + (rows.length ? `<dl>${rows.join("")}</dl>` : "")
    + `<div class="sect"><h3>Parents</h3>${chips(d.parents)}</div>`
    + `<div class="sect"><h3>Partner${(d.partners || []).length > 1 ? "s" : ""}</h3>${chips(d.partners)}</div>`
    + `<div class="sect"><h3>Children</h3>${chips(d.children)}</div>`
    + `<div class="sect"><h3>Siblings</h3>${chips(d.siblings)}</div>`
    + `<div class="sect"><h3>Life</h3>`
    +   (d.bio ? `<div class="bio">${d.bio}</div>`
              : `<span class="empty">Nothing written yet — add prose to people/${esc(d.id)}.md</span>`)
    + `</div>`
    + ((d.notes && d.notes.length)
        ? `<div class="sect"><h3>Notes</h3><div class="bio">${d.notes.map(esc).join("<br><br>")}</div></div>` : "")
    + ((d.sources && d.sources.length)
        ? `<div class="sect"><h3>Sources</h3><span class="hint">${d.sources.map(esc).join(", ")}</span></div>` : "");
}

panel.addEventListener("click", e => {
  const a = e.target.closest("[data-goto]");
  if (a) { e.preventDefault(); select(a.dataset.goto); }
});
svg.addEventListener("click", () => select(null));

function routeFromHash() {
  const m = /^#\/person\/(.+)$/.exec(location.hash || "");
  if (m && byId.has(decodeURIComponent(m[1]))) select(decodeURIComponent(m[1]), false);
  else select(null, false);
}
addEventListener("hashchange", routeFromHash);

/* ---------- search ---------- */
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (selected) select(null);
  nodeEls.forEach(({ g, n }) =>
    g.classList.toggle("dim", !!q && !(n.name.toLowerCase().includes(q) || (n.telugu || "").includes(q))));
});

/* ---------- legend ---------- */
function drawLegend() {
  const el = document.getElementById("legend");
  el.innerHTML = colorBy === "sex"
    ? `<span><i class="m"></i>Male</span><span><i class="f"></i>Female</span>`
      + `<span style="color:var(--text-muted)">Greyed name = deceased</span>`
      + `<span style="color:var(--text-muted)">Dashed = partners</span>`
    : LINEAGES.map((l, i) => `<span><i class="l-${i}"></i>${l}</span>`).join("");
}
document.getElementById("colorBy").addEventListener("change", e => { colorBy = e.target.value; paint(); drawLegend(); });
document.getElementById("fitBtn").addEventListener("click", fit);
document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  paint(); drawLegend(); if (selected) select(selected, false);
});

/* ---------- table ---------- */
function drawTable() {
  const rows = [...nodes].sort((a, b) => a.gen - b.gen || a.name.localeCompare(b.name));
  document.getElementById("tableView").innerHTML =
    `<table><thead><tr><th>Gen</th><th>Name</th><th>Telugu</th><th>Born</th><th>Died</th>
     <th>Lineage</th><th>Flags</th></tr></thead><tbody>`
    + rows.map(d => `<tr data-goto="${d.id}"><td>${d.gen + 1}</td>`
      + `<td class="${d.deceased ? "gone" : ""}">${esc(d.name)}</td><td>${esc(d.telugu)}</td>`
      + `<td>${esc(d.birth)}</td><td>${esc(d.deceased ? (d.death || "yes") : "")}</td><td>${esc(d.lineage)}</td>`
      + `<td>${d.confidence !== "high" ? '<span class="badge warn">unverified</span>' : ""}`
      + `${d.redacted ? '<span class="badge">withheld</span>' : ""}</td></tr>`).join("")
    + `</tbody></table>`;
}
document.getElementById("tableView").addEventListener("click", e => {
  const tr = e.target.closest("[data-goto]");
  if (tr) { document.getElementById("viewBtn").click(); select(tr.dataset.goto); }
});
document.getElementById("viewBtn").addEventListener("click", e => {
  const show = e.target.getAttribute("aria-pressed") === "false";
  e.target.setAttribute("aria-pressed", String(show));
  e.target.textContent = show ? "Graph" : "Table";
  document.getElementById("graph").style.display = show ? "none" : "";
  panel.style.display = show ? "none" : "";
  document.getElementById("tableView").style.display = show ? "block" : "none";
  if (show) drawTable();
});

/* ---------- size ---------- */
function resize() {
  const r = document.getElementById("graph").getBoundingClientRect();
  W = r.width; H = r.height;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  alpha = Math.max(alpha, 0.5);
}
new ResizeObserver(resize).observe(document.getElementById("graph"));
resize(); paint(); drawLegend(); panel.innerHTML = HINT; routeFromHash();
</script>
</body>
</html>
