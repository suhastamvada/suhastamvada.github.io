<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0B0FKP0KQW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-0B0FKP0KQW');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects — Suhas Tamvada</title>
    <meta name="description" content="Research projects by Suhas Tamvada.">

    <!-- Dark mode: apply saved theme before CSS loads to prevent flash -->
    <script>
      (function() {
        var theme = localStorage.getItem('theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <main class="one-page">
        <a href="/" class="back-link">&larr; Suhas Tamvada</a>

        <div id="group-content">
            <p class="loading">Loading projects...</p>
        </div>

        <footer>
            <p>&copy; 2026 Suhas Tamvada</p>
        </footer>
    </main>

    <script>
      (function() {
        var container = document.getElementById('group-content');
        var group = new URLSearchParams(window.location.search).get('group') || 'all';

        var TITLES = {
          fluids: 'Fluids',
          thermals: 'Thermals',
          misc: 'Misc',
          all: 'Projects'
        };

        function esc(s) {
          var d = document.createElement('div');
          d.textContent = s;
          return d.innerHTML;
        }

        function renderProject(p) {
          var imgs = p.images || [];
          var sliderHtml = '';
          if (imgs.length > 0) {
            sliderHtml =
              '<div class="slider">' +
                '<div class="slider-track">' +
                imgs.map(function(src, i) {
                  return '<div class="slide"><img src="' + src + '" alt="' + esc(p.name) + ' — slide ' + (i + 1) + '" loading="lazy" onerror="this.closest(\'.slider\').style.display=\'none\'"></div>';
                }).join('') +
                '</div>' +
                (imgs.length > 1
                  ? '<button class="slider-btn prev" aria-label="Previous image">&larr;</button>' +
                    '<button class="slider-btn next" aria-label="Next image">&rarr;</button>' +
                    '<div class="slider-dots">' +
                    imgs.map(function(_, i) {
                      return '<button class="dot' + (i === 0 ? ' active' : '') + '" data-i="' + i + '" aria-label="Go to image ' + (i + 1) + '"></button>';
                    }).join('') +
                    '</div>'
                  : '') +
              '</div>';
          }

          var techHtml = (p.tech || []).map(function(t) {
            return '<span class="tech-tag">' + esc(t) + '</span>';
          }).join('');

          var linksHtml = (p.papers || []).map(function(paper) {
            return '<a href="' + paper.url + '" class="project-link" target="_blank" rel="noopener">' + esc(paper.label) + '</a>';
          }).join('');
          if (p.github) {
            linksHtml += '<a href="' + p.github + '" class="project-link" target="_blank" rel="noopener">GitHub</a>';
          }

          return '<section class="project-detail" id="' + p.id + '">' +
            '<div class="project-detail-header">' +
              '<p class="project-card-meta">' + esc(p.year || '') + '</p>' +
              '<h2 class="project-detail-title">' + esc(p.name) + '</h2>' +
              '<div class="project-card-tech">' + techHtml + '</div>' +
            '</div>' +
            sliderHtml +
            '<p class="project-summary">' + esc(p.summary || '') + '</p>' +
            (linksHtml ? '<div class="project-card-links">' + linksHtml + '</div>' : '') +
          '</section>';
        }

        function initSlider(slider) {
          var track = slider.querySelector('.slider-track');
          var dots = slider.querySelectorAll('.dot');
          var n = slider.querySelectorAll('.slide').length;
          if (n < 2) return;
          var current = 0;

          function go(i) {
            current = (i + n) % n;
            track.scrollTo({ left: track.clientWidth * current, behavior: 'smooth' });
          }

          slider.querySelector('.prev').addEventListener('click', function() { go(current - 1); });
          slider.querySelector('.next').addEventListener('click', function() { go(current + 1); });
          dots.forEach(function(dot) {
            dot.addEventListener('click', function() { go(parseInt(dot.dataset.i, 10)); });
          });

          var timer;
          track.addEventListener('scroll', function() {
            clearTimeout(timer);
            timer = setTimeout(function() {
              current = Math.round(track.scrollLeft / track.clientWidth);
              dots.forEach(function(d, i) { d.classList.toggle('active', i === current); });
            }, 80);
          });
        }

        fetch('assets/projects.json')
          .then(function(r) {
            if (!r.ok) throw new Error('Failed to load');
            return r.json();
          })
          .then(function(projects) {
            var items = group === 'all'
              ? projects
              : projects.filter(function(p) { return p.group === group; });

            if (items.length === 0) {
              container.innerHTML = '<p class="empty-state">No projects here yet. <a href="/">Go home</a>.</p>';
              return;
            }

            var title = TITLES[group] || 'Projects';
            document.title = title + ' — Suhas Tamvada';

            container.innerHTML =
              '<h1 class="group-title">' + title + '</h1>' +
              items.map(renderProject).join('');

            container.querySelectorAll('.slider').forEach(initSlider);

            if (location.hash) {
              var target = document.querySelector(location.hash);
              if (target) target.scrollIntoView();
            }
          })
          .catch(function() {
            container.innerHTML = '<p class="empty-state">Could not load projects.</p>';
          });
      })();
    </script>
</body>
</html>
